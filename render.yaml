services:
  # Service 1: The MCP server that exposes Tavily search as a tool
  - type: web
    name: research-mcp-server
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python mcp_server/research_server.py
    envVars:
      - key: TAVILY_API_KEY
        sync: false   # We'll set this manually in Render dashboard
      - key: PORT
        value: 8000

  # Service 2: The Streamlit app
  - type: web
    name: research-assistant-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: multi-agent-research-assistant
      - key: LANGCHAIN_ENDPOINT
        value: https://apac.api.smith.langchain.com
      - key: MCP_SERVER_URL
        sync: false   # We'll set this to the MCP server's Render URL after it deploys
